name: final_attempt_app
description: "Final Attempt — Your IAS/BPSC Preparation Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.0

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # UI / Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  animations: ^2.0.11

  # Media
  youtube_player_flutter: ^9.1.2
  url_launcher: ^6.3.1
  open_file: ^3.5.10

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  collection: ^1.18.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
